name: Human Decision Gate Label Handler

on:
  issues:
    types: [labeled]

jobs:
  handle-fix-now:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'sentinel/fix-now'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd safety-governor && npm ci
          cd ../historical-db && npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Send ACTIVE override to Service Bus
        uses: actions/github-script@v7
        env:
          SERVICE_BUS_NAMESPACE: ${{ secrets.SERVICE_BUS_NAMESPACE }}
          SERVICE_BUS_QUEUE_NAME: ${{ secrets.SERVICE_BUS_QUEUE_NAME }}
        with:
          script: |
            const { handleFixNow } = require('./safety-governor/handlers/fix-now');
            const result = await handleFixNow(context.payload.issue.body);
            console.log(JSON.stringify({ message: 'fix-now processed', ...result }));

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Sentinel-D pipeline triggered. Full agentic remediation in progress.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

  handle-defer:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'sentinel/defer'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd safety-governor && npm ci
          cd ../historical-db && npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Write to deferred backlog
        id: defer
        uses: actions/github-script@v7
        env:
          TABLE_STORAGE_CONN_STRING: ${{ secrets.TABLE_STORAGE_CONN_STRING }}
          TABLE_STORAGE_ACCOUNT: ${{ secrets.TABLE_STORAGE_ACCOUNT }}
        with:
          script: |
            const { handleDefer } = require('./safety-governor/handlers/defer');
            const result = await handleDefer(context.payload.issue.body);
            const deferDate = result.defer_until.split('T')[0];
            core.setOutput('defer_date', deferDate);
            console.log(JSON.stringify(result));

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const deferDate = '${{ steps.defer.outputs.defer_date }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `📋 Added to deferred backlog. Will re-evaluate on ${deferDate}.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

  handle-wont-fix:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'sentinel/wont-fix'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd safety-governor && npm ci
          cd ../historical-db && npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Write ACCEPTED_RISK to Cosmos DB
        uses: actions/github-script@v7
        env:
          COSMOS_DB_ENDPOINT: ${{ secrets.COSMOS_DB_ENDPOINT }}
          COSMOS_DB_DATABASE: ${{ secrets.COSMOS_DB_DATABASE }}
          COSMOS_DB_CONTAINER: ${{ secrets.COSMOS_DB_CONTAINER }}
        with:
          script: |
            const { handleWontFix } = require('./safety-governor/handlers/wont-fix');
            const decidedBy = context.payload.sender.login;
            const issueUrl = context.payload.issue.html_url;
            const result = await handleWontFix(context.payload.issue.body, decidedBy, issueUrl);
            console.log(JSON.stringify({ message: 'accepted-risk recorded', ...result }));

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🔒 Recorded as accepted risk. Future Sentinel-D scans will not alert on this CVE in this file.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
